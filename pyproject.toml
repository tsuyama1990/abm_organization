[project]
name = "abm-organization"
version = "0.1.0"
description = "NK-based ABM to study organizational efficiency: JTC vs. flat vs. AI-agent structures in VUCA environments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "networkx>=3.3",
    "tqdm>=4.66",
    "pandas>=2.2",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
